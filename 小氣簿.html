<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小氣簿</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2a2420;--mu:#7a6f66;--bd:#e6ddd1;--red:#c0392b;--grn:#2e8b57;--amb:#b7791f;--ac:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#292524;--tx:#f3ece4;--mu:#a69d93;--bd:#3d3733;--red:#e5736a;--grn:#5fc08a;--amb:#e0a845;--ac:#e5736a}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#292524;--tx:#f3ece4;--mu:#a69d93;--bd:#3d3733;--red:#e5736a;--grn:#5fc08a;--amb:#e0a845;--ac:#e5736a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "PingFang HK","Noto Sans HK","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:26px}.mu{color:var(--mu);font-size:13px}
.stats{display:flex;gap:8px;margin:12px 0}.stats div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}.stats b{display:block;font-size:20px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 11px;cursor:pointer;text-decoration:none;display:inline-block}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;margin-top:12px;width:100%}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.tabs button.on{background:var(--tx);color:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.draft{color:var(--mu)}.wait{color:var(--amb)}.replied{color:var(--grn)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button.on.u{background:var(--red);color:#fff;border-color:var(--red)}.seg button.on.f{background:var(--grn);color:#fff;border-color:var(--grn)}
.card.forgiven{border-left:4px solid var(--grn)}.card.unforgiven{border-left:4px solid var(--red)}
.empty{text-align:center;color:var(--mu);padding:30px 0}
#sheet{position:fixed;left:-9999px;top:0;width:794px;min-height:1123px;background:#fff;color:#222;padding:70px 80px;font-family:"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;font-size:18px;line-height:1.9}
#sheet h2{text-align:center;font-size:36px;letter-spacing:8px;margin:0 0 6px;border-bottom:3px double #222;padding-bottom:14px}
#sheet .sg{display:flex;gap:40px;margin-top:70px}#sheet .sg div{flex:1;border-top:1.5px solid #222;padding-top:6px;font-size:15px}
</style></head><body><main>
<h1>😤 小氣簿</h1><div class="mu">記低邊個唔原諒、邊個原諒；自動出通告 PDF，WhatsApp 寄出，追返簽咗冇。</div>
<div class="stats"><div><b id="s1">0</b>唔原諒</div><div><b id="s2">0</b>已原諒</div><div><b id="s3">0</b>等緊回覆</div></div>
<details class="box"><summary><b>＋ 新增一筆</b></summary>
<label>對方稱呼</label><input id="n" placeholder="例如：阿明">
<label>WhatsApp 號碼（連區號，如 85291234567）</label><input id="ph" inputmode="tel" placeholder="85291234567">
<label>事件</label><input id="o" placeholder="例如：借咗我嘅充電器唔還">
<div class="g2"><div><label>日期</label><input id="d" type="date"></div><div><label>小氣指數</label><select id="sv"><option value="1">★</option><option value="2">★★</option><option value="3" selected>★★★</option><option value="4">★★★★</option><option value="5">★★★★★</option></select></div></div>
<label>決定</label><select id="stt"><option value="unforgiven">唔原諒</option><option value="forgiven">原諒</option></select>
<button class="p" id="add">加入小氣簿</button></details>
<div class="tabs" id="tabs"></div><div id="list"></div>
<div class="mu" style="margin-top:20px">資料只存喺呢部機嘅瀏覽器。簽咗嘅檔案請盡量細過 3MB。</div>
<div id="sheet"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const K='grudge-book-v1';let D=[],F='all',delArm=null,dl=null;
try{D=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){D=[]}
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){alert('儲存唔到，可能簽咗嘅檔案太大。');return false}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
$('#d').value=today();
(async()=>{try{dl=await window.claude.use('downloads')}catch(e){dl=null}})();
const stOf=e=>e.signed?'replied':e.sent?'wait':'draft';
const stLb={draft:'未發出',wait:'已發出・等緊回覆',replied:'已回覆・已簽'};
function notice(e){
  const s='★'.repeat(e.sv),nm=e.name,u=e.status==='unforgiven';
  return {title:u?'小氣通告':'原諒通告',sub:u?'（不予原諒）':'（特別開恩）',
   paras:u?[`茲通知 ${nm}：本人於 ${e.date} 因「${e.offence}」一事，心情大受影響，小氣指數評定為 ${s}。`,
    '經審慎考慮，本人現正式宣布：暫時不予原諒。此決定即時生效，直至另行通知。',
    '如欲爭取原諒，請於收到本通告後盡快回覆，並以道歉、請食飯或送飲品等誠意方式補救。',
    '請於下方簽署，確認已收悉本通告。']
   :[`茲通知 ${nm}：本人於 ${e.date} 因「${e.offence}」一事，曾經心情大受影響，小氣指數評定為 ${s}。`,
    '經深思熟慮，本人現正式宣布：原諒你。此事就此告一段落。',
    '惟本通告已記錄在案，如日後再犯，舊帳將一併計算，恕不另行通知。',
    '請於下方簽署，確認已收悉本通告並心存感激。']};
}
async function mkPdf(e){
  const n=notice(e),sh=$('#sheet');
  sh.innerHTML=`<h2>${n.title}</h2><div style="text-align:center;margin:-2px 0 24px;color:#555">${n.sub}　第 ${esc(e.id.slice(-4))} 號</div><div style="margin-bottom:6px">致：<b>${esc(e.name)}</b></div>${n.paras.map(p=>`<p style="margin:0 0 14px;text-indent:2em">${esc(p)}</p>`).join('')}<div style="text-align:right;margin-top:30px">發出日期：${today()}</div><div class="sg"><div>簽收人簽名</div><div>簽收日期</div></div>`;
  const c=await html2canvas(sh,{scale:2,backgroundColor:'#fff'});
  const {jsPDF}=window.jspdf,pdf=new jsPDF('p','pt','a4'),w=595.28,h=c.height*w/c.width;
  pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,Math.min(h,841.89));
  return pdf;
}
const fname=e=>`${e.status==='unforgiven'?'小氣通告':'原諒通告'}_${e.name}.pdf`;
async function saveFile(name,bytes){
  if(!dl){alert('呢個環境唔支援下載');return}
  try{await dl.save({filename:name,data:bytes})}catch(x){if(x&&x.code!=='declined')alert('下載失敗：'+(x.message||x.code))}
}
function waLink(e){
  const n=notice(e),t=`${e.name}，我發咗份《${n.title}》畀你，請睇附件 PDF，簽咗之後回傳畀我，多謝。`;
  const p=(e.phone||'').replace(/\D/g,'');
  return `https://wa.me/${p}?text=${encodeURIComponent(t)}`;
}
function b64(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function render(){
  const u=D.filter(e=>e.status==='unforgiven').length,f=D.length-u,w=D.filter(e=>stOf(e)==='wait').length;
  $('#s1').textContent=u;$('#s2').textContent=f;$('#s3').textContent=w;
  const T=[['all','全部'],['unforgiven','唔原諒'],['forgiven','已原諒'],['wait','等緊回覆'],['replied','已簽回']];
  $('#tabs').innerHTML=T.map(([k,l])=>`<button data-a="tab" data-k="${k}" class="${F===k?'on':''}">${l}</button>`).join('');
  const L=D.filter(e=>F==='all'||F===e.status||F===stOf(e));
  $('#list').innerHTML=L.length?L.map(e=>{const s=stOf(e);return `<div class="box card ${e.status}" data-id="${e.id}">
  <div class="top"><b style="font-size:17px">${esc(e.name)}</b><span class="badge ${s}">${stLb[s]}</span></div>
  <div class="mu">${esc(e.date)}・${'★'.repeat(e.sv)}${e.phone?'・'+esc(e.phone):''}</div>
  <p style="margin:6px 0 0">${esc(e.offence)}</p>
  <div class="row seg"><button data-a="st" data-v="unforgiven" class="u ${e.status==='unforgiven'?'on':''}">😤 唔原諒</button><button data-a="st" data-v="forgiven" class="f ${e.status==='forgiven'?'on':''}">😇 原諒</button></div>
  <div class="row"><button data-a="pdf">📄 通告 PDF</button><a class="btn" data-a="wa" href="${waLink(e)}" target="_blank" rel="noopener">💬 WhatsApp</a>${navigator.canShare?'<button data-a="share">📲 連 PDF 分享</button>':''}</div>
  <div class="row"><label class="btn" style="margin:0">📎 上載已簽檔<input type="file" data-a="up" accept="application/pdf,image/*" hidden></label>${e.signed?'<button data-a="dlsig">⬇ 睇／下載已簽檔</button>':''}<button data-a="del">${delArm===e.id?'確定刪除？':'🗑'}</button></div>
  ${e.signed?`<div class="mu" style="margin-top:6px">已收簽回：${esc(e.signed.name)}（${esc(e.signed.at)}）</div>`:''}</div>`}).join(''):'<div class="empty">仲未有紀錄，撳上面「新增一筆」開始記仇。</div>';
}
$('#add').onclick=()=>{
  const n=$('#n').value.trim(),o=$('#o').value.trim();if(!n||!o){alert('請填稱呼同事件');return}
  D.unshift({id:'g'+Date.now(),name:n,phone:$('#ph').value.trim(),offence:o,date:$('#d').value||today(),sv:+$('#sv').value,status:$('#stt').value});
  if(save()){['#n','#ph','#o'].forEach(s=>$(s).value='');$('#d').value=today();$('details').open=false}render();
};
$('#tabs').onclick=ev=>{const b=ev.target.closest('[data-a=tab]');if(b){F=b.dataset.k;render()}};
$('#list').onclick=async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.dataset.a==='up')return;
  const c=b.closest('.card'),e=c&&D.find(x=>x.id===c.dataset.id),a=b.dataset.a;if(!e)return;
  if(a==='st'){e.status=b.dataset.v;save();render()}
  else if(a==='wa'){if(!e.sent){e.sent=today();save();setTimeout(render,300)}}
  else if(a==='pdf'||a==='share'){
    b.disabled=true;const t=b.textContent;b.textContent='整緊…';
    try{const p=await mkPdf(e);
      if(a==='pdf'){await saveFile(fname(e),new Uint8Array(p.output('arraybuffer')))}
      else{const f=new File([p.output('blob')],fname(e),{type:'application/pdf'});
        if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],text:`${e.name}，請簽咗再傳返畀我。`});if(!e.sent){e.sent=today();save()}}catch(x){}}
        else alert('呢部機唔支援直接分享檔案，請用「通告 PDF」下載後喺 WhatsApp 手動夾附件。')}
    }catch(x){alert('整 PDF 失敗：'+x.message)}
    b.disabled=false;b.textContent=t;render();
  }
  else if(a==='dlsig'){await saveFile(e.signed.name,b64(e.signed.url))}
  else if(a==='del'){if(delArm===e.id){D=D.filter(x=>x!==e);delArm=null;save()}else delArm=e.id;render()}
};
$('#list').onchange=ev=>{
  const i=ev.target.closest('[data-a=up]');if(!i||!i.files[0])return;
  const e=D.find(x=>x.id===i.closest('.card').dataset.id),f=i.files[0];
  const r=new FileReader();r.onload=()=>{const old=e.signed;e.signed={name:f.name,url:r.result,at:today()};if(!save())e.signed=old;render()};r.readAsDataURL(f);
};
render();
</script></body></html>
