<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小氣簿</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2a2420;--mute:#7a6f66;--line:#e6ddd2;--red:#c0392b;--green:#2e7d4f;--amber:#b7791f;--btn:#2a2420;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--card:#26221e;--ink:#f1ebe4;--mute:#a89d92;--line:#3b352f;--red:#ef7a6c;--green:#6fcf97;--amber:#e9b44c;--btn:#f1ebe4;--btnink:#1b1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1815;--card:#26221e;--ink:#f1ebe4;--mute:#a89d92;--line:#3b352f;--red:#ef7a6c;--green:#6fcf97;--amber:#e9b44c;--btn:#f1ebe4;--btnink:#1b1815;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0}h1 small{font-size:13px;color:var(--mute);font-weight:400;margin-left:8px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px}
button.p{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
button.danger{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:var(--btn);color:var(--btnink)}
.item h3{margin:0 0 2px;font-size:17px}.meta{color:var(--mute);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;border:1px solid currentColor;margin-right:5px}
.t-red{color:var(--red)}.t-green{color:var(--green)}.t-amber{color:var(--amber)}.t-mute{color:var(--mute)}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnink);padding:9px 16px;border-radius:99px;display:none;max-width:90%;z-index:9}
#stage{position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#222}
.nt{width:794px;min-height:1123px;padding:70px 72px;font:16px/1.9 "Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;color:#222;background:#fff}
.nt h2{text-align:center;font-size:34px;letter-spacing:12px;margin:0 0 6px}
.nt .sub{text-align:center;color:#888;font-size:13px;margin-bottom:26px;border-bottom:2px solid #222;padding-bottom:14px}
.nt table{width:100%;border-collapse:collapse;margin:14px 0}.nt td{border:1px solid #bbb;padding:7px 11px}.nt td:first-child{width:130px;background:#f4f1ec}
.nt .sig{display:flex;gap:40px;margin-top:70px}.nt .sig div{flex:1;border-top:1.5px solid #222;padding-top:6px;font-size:14px}
.nt .foot{margin-top:30px;font-size:12px;color:#888}
</style>
</head>
<body>
<main>
<h1>小氣簿<small>記低先，唔好忘記</small></h1>

<div class="box">
<b>新增一條數</b>
<div class="row"><div><label>對方名稱</label><input id="f-name" placeholder="例：阿明"></div>
<div><label>WhatsApp 號碼（連區號）</label><input id="f-phone" inputmode="tel" placeholder="例：85291234567"></div></div>
<label>事件經過</label><textarea id="f-what" rows="2" placeholder="例：借咗我 $200 食飯，講咗話第日還"></textarea>
<div class="row"><div><label>事發日期</label><input id="f-date" type="date"></div>
<div><label>嚴重程度</label><select id="f-sev"><option value="1">★ 小事一件</option><option value="2">★★ 有啲嬲</option><option value="3" selected>★★★ 幾嬲</option><option value="4">★★★★ 好嬲</option><option value="5">★★★★★ 永不原諒級</option></select></div></div>
<div class="row"><div><label>要求對方做乜</label><select id="f-ask"><option>誠懇道歉</option><option>還錢</option><option>請食飯</option><option>買杯飲品賠罪</option><option>親口解釋清楚</option></select></div>
<div><label>回覆限期</label><input id="f-due" type="date"></div></div>
<div class="acts"><button class="p" id="add">記低佢</button></div>
</div>

<div class="tabs" id="tabs"></div>
<div id="list"></div>
</main>
<div id="stage"></div>
<div id="toast"></div>
<input type="file" id="up" accept="application/pdf" hidden>

<script>
const $=s=>document.querySelector(s);
const SK='grudge-book-v1';
let data=[];let filter='all';let upId=null;
try{data=JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){data=[]}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(data))}catch(e){toast('儲存失敗，瀏覽器可能唔俾存')}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);

/* IndexedDB for signed PDFs */
function db(){return new Promise((res,rej)=>{try{const r=indexedDB.open('grudge-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}
async function putFile(k,b){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function getFile(k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function delFile(k){try{const d=await db();d.transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}}

/* Notice text (auto-written) */
function fmt(d){if(!d)return'—';const [y,m,dd]=d.split('-');return `${y}年${+m}月${+dd}日`}
function noticeHTML(r){
  const today=fmt(new Date().toISOString().slice(0,10));
  const no='GB-'+r.id.slice(-6).toUpperCase();
  if(r.forgiven){
    return `<div class="nt"><h2>寬 恕 通 知</h2><div class="sub">編號 ${no}　｜　發出日期 ${today}</div>
    <p>致 <b>${esc(r.name)}</b>：</p>
    <p>本人經詳細考慮，就 ${esc(fmt(r.date))} 發生之事件（${esc(r.what)}），現正式通知閣下：<b>本人已決定原諒閣下</b>，此事就此作罷，日後不再追究。</p>
    <p>惟望閣下引以為鑑，日後多加留意。</p>
    <table><tr><td>事件</td><td>${esc(r.what)}</td></tr><tr><td>事發日期</td><td>${esc(fmt(r.date))}</td></tr><tr><td>處理結果</td><td>已原諒（小氣指數：${stars(+r.sev)}）</td></tr></table>
    <p>如閣下已知悉並感激本人之大量，請於下方簽署確認，並於 ${esc(fmt(r.due))} 前回覆。</p>
    <div class="sig"><div>被通知人簽署：${esc(r.name)}<br>日期：</div><div>通知人簽署<br>日期：${today}</div></div>
    <div class="foot">本通知由「小氣簿」自動生成，純屬娛樂，不具法律效力。</div></div>`;
  }
  return `<div class="nt"><h2>追 討 通 告</h2><div class="sub">編號 ${no}　｜　發出日期 ${today}</div>
  <p>致 <b>${esc(r.name)}</b>：</p>
  <p>本人於 ${esc(fmt(r.date))}，發生以下事件：<b>${esc(r.what)}</b>。此事令本人極度不快（小氣指數：${stars(+r.sev)}），本人至今仍未釋懷，特此發出本通告，鄭重通知閣下。</p>
  <table><tr><td>事件</td><td>${esc(r.what)}</td></tr><tr><td>事發日期</td><td>${esc(fmt(r.date))}</td></tr><tr><td>小氣指數</td><td>${stars(+r.sev)}（${r.sev}/5）</td></tr><tr><td>本人要求</td><td><b>${esc(r.ask)}</b></td></tr><tr><td>回覆限期</td><td>${esc(fmt(r.due))}</td></tr></table>
  <p>閣下須於上述限期前，履行上述要求，並於本通告下方簽署確認收悉，然後將已簽署之通告交回本人。</p>
  <p>逾期未有回覆，本人保留繼續記仇、無限期黑面、及於飯局上提起此事之權利。</p>
  <div class="sig"><div>被通知人簽署：${esc(r.name)}<br>日期：</div><div>通知人簽署<br>日期：${today}</div></div>
  <div class="foot">本通告由「小氣簿」自動生成，純屬娛樂，不具法律效力。</div></div>`;
}
async function makePDF(r){
  const st=$('#stage');st.innerHTML=noticeHTML(r);
  try{await document.fonts.ready}catch(e){}
  const c=await html2canvas(st.firstElementChild,{scale:2,backgroundColor:'#fff'});
  st.innerHTML='';
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,Math.min(297,c.height*210/c.width));
  return pdf.output('blob');
}
async function saveBlob(name,blob){
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:name,data:blob});return true}catch(e){if(e&&e.code==='declined')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;
}
const byId=id=>data.find(x=>x.id===id);
const fname=r=>`通告_${r.name}_${r.date||'未填日期'}.pdf`;

/* Actions */
async function dlNotice(id){const r=byId(id);toast('生成緊 PDF…');try{const b=await makePDF(r);if(await saveBlob(fname(r),b))toast('PDF 已準備好')}catch(e){toast('生成失敗：'+e.message)}}
async function wa(id){
  const r=byId(id);const ph=(r.phone||'').replace(/\D/g,'');
  if(!ph){toast('請先填 WhatsApp 號碼');return}
  const msg=r.forgiven?`${r.name}，我已經原諒咗你啦，通知書已生成，請簽咗交返俾我 🙏`:`${r.name}，有份「追討通告」要你簽收。事件：${r.what}。請於 ${fmt(r.due)} 前簽咗覆我。`;
  try{const b=await makePDF(r);const f=new File([b],fname(r),{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text:msg});mark(r);return}
    await saveBlob(fname(r),b);}catch(e){if(e&&e.name==='AbortError')return}
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');
  toast('已開 WhatsApp，請喺對話撳「附件」揀剛下載嗰份 PDF');mark(r);
}
function mark(r){if(r.status==='draft'){r.status='sent';r.sentAt=Date.now();save();render()}}
function pick(id){upId=id;$('#up').value='';$('#up').click()}
$('#up').onchange=async e=>{const f=e.target.files[0];if(!f||!upId)return;const r=byId(upId);
  if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){toast('請上載 PDF 檔');return}
  try{await putFile(r.id,f);r.status='replied';r.fileName=f.name;r.repliedAt=Date.now();save();render();toast('已儲存已簽通告 ✔')}catch(x){toast('上載失敗，瀏覽器未能儲存檔案')}};
async function dlSigned(id){const r=byId(id);try{const b=await getFile(id);if(!b){toast('搵唔到檔案');return}if(await saveBlob(r.fileName||fname(r),b))toast('已下載')}catch(e){toast('讀取失敗')}}
function toggleForgive(id){const r=byId(id);r.forgiven=!r.forgiven;save();render();toast(r.forgiven?'好，原諒咗佢 🕊️':'收回原諒，繼續記仇 😤')}
async function del(id){if(!confirm('真係刪除呢條記錄？'))return;data=data.filter(x=>x.id!==id);await delFile(id);save();render()}

$('#add').onclick=()=>{
  const name=$('#f-name').value.trim(),what=$('#f-what').value.trim();
  if(!name||!what){toast('名同事件一定要填');return}
  const due=$('#f-due').value||new Date(Date.now()+7*864e5).toISOString().slice(0,10);
  data.unshift({id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,phone:$('#f-phone').value.trim(),what,
    date:$('#f-date').value||new Date().toISOString().slice(0,10),sev:$('#f-sev').value,ask:$('#f-ask').value,due,forgiven:false,status:'draft',created:Date.now()});
  save();['f-name','f-phone','f-what'].forEach(i=>$('#'+i).value='');render();toast('已記低 ✍️');
};

const TABS=[['all','全部'],['unforgiven','未原諒'],['forgiven','已原諒'],['draft','未發通告'],['sent','等緊回覆'],['replied','已回覆簽咗']];
function render(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${filter===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.k;render()});
  const rows=data.filter(r=>filter==='all'||(filter==='unforgiven'&&!r.forgiven)||(filter==='forgiven'&&r.forgiven)||r.status===filter);
  if(!rows.length){$('#list').innerHTML='<div class="empty">暫時冇記錄。寬宏大量，或者未有人得罪你。</div>';return}
  $('#list').innerHTML=rows.map(r=>{
    const st={draft:['未發通告','t-mute'],sent:['已發出・等緊回覆','t-amber'],replied:['已回覆・已簽','t-green']}[r.status];
    const late=r.status==='sent'&&r.due&&r.due<new Date().toISOString().slice(0,10);
    return `<div class="box item"><h3>${esc(r.name)} <span class="meta">${stars(+r.sev)}</span></h3>
    <div>${esc(r.what)}</div><div class="meta">事發：${esc(fmt(r.date))}　要求：${esc(r.ask)}　限期：${esc(fmt(r.due))}${late?'（已逾期）':''}</div>
    <div style="margin-top:8px"><span class="tag ${r.forgiven?'t-green':'t-red'}">${r.forgiven?'已原諒':'未原諒'}</span><span class="tag ${st[1]}">${st[0]}</span>${r.fileName?`<span class="meta">📎 ${esc(r.fileName)}</span>`:''}</div>
    <div class="acts">
    <button class="p" onclick="dlNotice('${r.id}')">下載通告 PDF</button>
    <button onclick="wa('${r.id}')">WhatsApp 發送</button>
    <button onclick="pick('${r.id}')">上載已簽 PDF</button>
    ${r.status==='replied'?`<button onclick="dlSigned('${r.id}')">下載已簽 PDF</button>`:''}
    <button onclick="toggleForgive('${r.id}')">${r.forgiven?'收回原諒':'原諒佢'}</button>
    <button class="danger" onclick="del('${r.id}')">刪除</button></div></div>`}).join('');
}
render();
</script>
</body>
</html>
